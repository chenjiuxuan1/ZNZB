        - label: 卡片名称
          max_length: 256
          required: false
          type: text-input
          variable: card_title
        - label: 看板链接
          max_length: 2048
          required: false
          type: text-input
          variable: dashboard_url
        - default: ''
          hint: ''
          label: state_json
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: state_json
          max_length: 50000
