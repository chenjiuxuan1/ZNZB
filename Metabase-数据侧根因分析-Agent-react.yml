                search_val:
                  auto: 1
                  value: null
                start_time:
                  auto: 1
                  value: null
                end_time:
                  auto: 1
                  value: null
              provider_name: cb8c5409-2ece-4e19-bd5d-babea222bfaa
              provider_show_name: 数仓代码血缘查询
              settings: {}
              tool_description: 查询 DolphinScheduler 任务运行状态。action 可选 check_failed_instances（查失败实例）、search_resource_sql（按
                SQL 搜 DS 资源）。用于判断上游 DS 任务是否失败。
              tool_label: check_ds_status
              tool_name: check_ds_status
              type: api
        agent_strategy_label: ReAct
        agent_strategy_name: ReAct
        agent_strategy_provider_name: langgenius/agent/agent
        desc: 限制工具调用和递归层数的只读异常根因分析。
        output_schema: null
