        desc: 由值班平台传入单条 Metabase 异常及运行上下文。
        selected: false
        title: 接收异常
        type: start
        variables:
        - label: 巡检运行 ID
          max_length: 128
          required: true
          type: text-input
          variable: run_id
        - label: 国家代码
          max_length: 16
          required: true
          type: text-input
          variable: country_code
        - label: 异常序号
          required: true
          type: number
          variable: anomaly_index
        - label: 异常原文
          max_length: 12000
          required: true
          type: paragraph
          variable: anomaly_message
        - label: 看板名称
          max_length: 256
          required: false
          type: text-input
          variable: dashboard_title
        - label: 卡片名称
          max_length: 256
          required: false
          type: text-input
          variable: card_title
        - label: 看板链接
          max_length: 2048
          required: false
          type: text-input
          variable: dashboard_url
        - default: ''
          hint: ''
          label: state_json
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: state_json
          max_length: 50000
      height: 361
      id: start
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        agent_parameters:
          max_iterations:
            type: constant
            value: 25
          instruction:
            type: constant
            value: '你是 Metabase 异常数据侧根因分析 Agent。你拥有 4 个只读工具，需要自主调用它们来追溯异常根因。你必须深入调查，不能浅尝辄止。

可用工具：

1. get_card_sql - 读取异常对应 Metabase 卡片的 SQL，从中提取底表。必须最先调用（除非 state_json 中已有 cardSql）。

2. trace_lineage - 查询表的代码血缘，发现上游表和 producer SQL。只有 evidence.quality=producer_sql 时 upstreamTables 才是有效上游。你必须对上游表递归调用 trace_lineage，至少追溯 2-3 层，直到找到最源头的表或 producer SQL。

3. check_wattrel - 查询国家的 Wattrel 质量告警。你不仅要查底表，还要查所有上游表是否有质量告警。

4. check_ds_status - 查询 DolphinScheduler 任务运行状态。可用 action：
   - search_resource_sql：用 producer SQL 搜 DS 资源，找到具体工作流。必须先调用此 action 找到工作流！
   - check_failed_instances：用工作流名查失败实例。必须传 search_val=工作流名，start_time/end_time 传异常日期前后范围。
   - list_instances：列工作流实例，确认异常当天是否真的运行了。
   不要只查 check_failed_instances 就下结论。必须先用 search_resource_sql 找到具体工作流，再查该工作流在异常日期的运行状态。

强制调查流程（必须执行全部步骤才能 finish）：

第1步：调用 get_card_sql 获取卡片 SQL（如 state_json 已有 cardSql 可跳过），提取 FROM/JOIN 后的底表名。

第2步：对底表调用 trace_lineage。记录 upstreamTables 和 producer SQL。

第3步：对每个 upstreamTable 再次调用 trace_lineage（递归追溯，至少 2 层）。记录每层的 producer SQL。

第4步：对底表和所有上游表，调用 check_wattrel 查质量告警。

第5步：用底表的 producer SQL 调用 check_ds_status（action=search_resource_sql），找到对应的 DS 工作流名称。

第6步：用找到的工作流名调用 check_ds_status（action=check_failed_instances, search_val=工作流名, start_time=异常日期前1天, end_time=异常日期后1天），查失败实例。

第7步：如未发现失败，调用 check_ds_status（action=list_instances, search_val=工作流名, start_time=异常日期, end_time=异常日期），确认异常当天工作流是否真的运行了。

第8步：综合所有证据给出结论。只有完成第2-7步后才能输出 finish。

根因判定规则：
- DS 任务失败或未运行 -> data_issue（置信度 high）
- Wattrel 质量告警匹配到相关表 -> data_issue（置信度 high）
- DS 正常运行 + 无质量告警 + 指标变化 -> business_change（置信度 medium）
- 证据不足（工具失败或未完成调查）-> insufficient_evidence（置信度 low）

输入字段：
- run_id: {{#start.run_id#}}
- country_code: {{#start.country_code#}}
- anomaly_index: {{#start.anomaly_index#}}
- anomaly_message: {{#start.anomaly_message#}}
- dashboard_title: {{#start.dashboard_title#}}
- card_title: {{#start.card_title#}}
- dashboard_url: {{#start.dashboard_url#}}
- state_json: {{#start.state_json#}}

state_json 是 n8n 传入的上下文（可能包含已获取的 Card SQL 证据）。如果 state_json 中已有 cardSql 和 cardTables，可以跳过 get_card_sql 直接调用 trace_lineage。

输出规则：
- 最终输出必须是一个合法 JSON 对象，第一个字符是 {，最后一个字符是 }。
- 不要输出 Markdown、代码块或多个 JSON。
- 不得编造未通过工具获取的表名、SQL、工作流名称或运行状态。
- 不得输出重跑、修复、写入等操作指令。
- 不得在未完成第2-7步调查的情况下输出 finish。如果工具调用失败，可以在 finish 中说明 limitations，但必须尝试调用所有工具。

输出格式：
{"action":"finish","summary":"根因摘要","evidence":["证据1","证据2"],"possibleCauses":["原因1"],"verificationSteps":["步骤1"],"recommendedActions":["建议1"],"confidence":"high|medium|low","limitations":"证据边界","dataSideVerdict":"data_issue|business_change|insufficient_evidence","notificationAction":"send|downgrade|enrich_only"}'
          model:
            type: constant
            value:
              completion_params: {}
              mode: chat
              model: qwen3.6-plus
              model_type: llm
              provider: langgenius/tongyi/tongyi
              type: model-selector
          query:
            type: constant
            value: '{{#start.anomaly_message#}}'
          tools:
            type: constant
            value:
