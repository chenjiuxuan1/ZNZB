- analysis_stage: {{#start.analysis_stage#}}
- dashboard_uuid: {{#start.dashboard_uuid#}}
- dashboard_summary: {{#start.dashboard_summary#}}
- screening_json: {{#start.screening_json#}}

state_json 仅为兼容旧调用保留；协议 v4 应以 snapshot_id 对应的公共快照为准。

输出规则：
- 最终输出必须是一个合法 JSON 对象，第一个字符是 {，最后一个字符是 }。
- 不要输出 Markdown、代码块或多个 JSON。
- 不得编造未通过工具获取的表名、SQL、工作流名称或运行状态。
- 不得输出重跑、修复、写入等操作指令。
- 关键证据已满足上述判定规则时可直接 finish；工具失败时必须保守输出 insufficient_evidence。

输出格式必须严格匹配阶段，且 verdicts 必须对 cases_json 中每个 anomalyIndex 各一项，不多不少：
dashboard_screening：{"action":"finish","dashboardSummary":"看板公共证据总结","verdicts":[{"anomalyIndex":0,"screeningVerdict":"verified_normal|suspected_issue|needs_deep_analysis","summary":"指标初判","evidence":["证据1"],"limitations":"证据边界"}]}
metric_deep_analysis：{"action":"finish","verdicts":[{"anomalyIndex":0,"summary":"独立根因摘要","evidence":["证据1"],"possibleCauses":["原因1"],"verificationSteps":["步骤1"],"recommendedActions":["建议1"],"confidence":"high|medium|low","limitations":"证据边界","dataSideVerdict":"data_issue|business_change|verified_normal|insufficient_evidence","notificationAction":"send|downgrade|enrich_only","chartVisibility":"show|hide_verified_normal","verificationReason":"verified_normal 时提供本轮查询与时间证据"}]}'
          model:
