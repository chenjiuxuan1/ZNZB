version: 0.1.5
kind: app
app:
  name: Metabase 数据侧根因分析 Agent
  mode: workflow
  icon: "🔎"
  icon_type: emoji
  icon_background: "#D5F5E3"
  description: 只读取证型 Agent。根据 Metabase 异常，自主选择 SQL、血缘、分区和 DS 工具进行有限层级追溯，并给出数据侧判断。
  use_icon_as_answer_icon: false
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    nodes:
      - id: start
        type: custom
        position:
          x: 80
          y: 280
        positionAbsolute:
          x: 80
          y: 280
        width: 243
        height: 170
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: 接收异常
          desc: 由值班平台传入单条 Metabase 异常及运行上下文。
          selected: false
          variables:
            - variable: run_id
              label: 巡检运行 ID
              type: text-input
              required: true
              max_length: 128
            - variable: country_code
              label: 国家代码
              type: text-input
              required: true
              max_length: 16
            - variable: anomaly_index
              label: 异常序号
              type: number
              required: true
            - variable: anomaly_message
              label: 异常原文
              type: paragraph
              required: true
              max_length: 12000
            - variable: dashboard_title
              label: 看板名称
              type: text-input
              required: false
              max_length: 256
            - variable: card_title
              label: 卡片名称
              type: text-input
              required: false
              max_length: 256
            - variable: dashboard_url
              label: 看板链接
              type: text-input
              required: false
              max_length: 2048
      - id: agent
        type: custom
        position:
          x: 390
          y: 250
        positionAbsolute:
          x: 390
          y: 250
        width: 360
        height: 250
        sourcePosition: right
        targetPosition: left
        data:
          type: agent
          title: 数据侧取证 Agent
          desc: 限制工具调用和递归层数的只读异常根因分析。
          selected: false
          agent_parameters:
            instruction:
              type: constant
              value: |-
                你是“Metabase 数据侧根因分析 Agent”，只负责取证和判断，不执行任何写操作、重跑、修复或权限变更。

                输入异常：
                - run_id: {{#start.run_id#}}
                - country_code: {{#start.country_code#}}
                - anomaly_index: {{#start.anomaly_index#}}
                - dashboard_title: {{#start.dashboard_title#}}
                - card_title: {{#start.card_title#}}
                - dashboard_url: {{#start.dashboard_url#}}
                - anomaly_message: {{#start.anomaly_message#}}

                可用工具在绑定后按以下职责使用：
                1. get_card_sql：获取本异常对应 Metabase 卡片 SQL 和初始表。
                2. trace_lineage：追溯一个已发现的表。仅 producer_sql 的 upstreamTables 可作为递归证据；declared_dependency_only 只可作为线索。
                3. check_partition：对已发现表检查异常日期和基准日期的只读分区/聚合数据。
                4. check_ds_workflow：仅在血缘返回明确 DS 引用后查询对应工作流状态。

                决策规则：
                - 先调用 get_card_sql；不能根据看板名猜测表。
                - 只允许查询工具结果中出现过的表，不得构造任意表名或任意 SQL。
                - 最多追溯 3 层、最多 6 次工具调用、每层最多检查 3 张表。达到限制后必须结束。
                - 无 SQL、权限不足、血缘只有 declared_dependency_only 或分区证据不足时，结论必须为 insufficient_evidence，不能把推测说成事实。
                - 多张指标同时归零且分区未产出、或上游 DS 明确失败时，才可判为 data_issue。
                - 分区/ETL 均正常且业务量变化能够解释异常时，才可判为 business_change。
                - 无论结论如何，原巡检告警不由本 Agent 自动关闭。

                仅输出一个合法 JSON 对象，不要 Markdown，不要代码块：
                {
                  "summary": "一句话结论",
                  "evidence": ["最多 5 条、每条必须来自工具结果"],
                  "possibleCauses": ["最多 3 条"],
                  "verificationSteps": ["最多 3 条"],
                  "recommendedActions": ["最多 3 条"],
                  "confidence": "high|medium|low",
                  "limitations": "证据限制",
                  "dataSideVerdict": "data_issue|business_change|insufficient_evidence",
                  "notificationAction": "send|downgrade|enrich_only"
                }
            query:
              type: constant
              value: '{{#start.anomaly_message#}}'
            model:
              type: constant
              value: null
            tools:
              type: constant
              value: []
          agent_strategy_provider_name: langgenius/agent/agent
          agent_strategy_name: ReAct
          agent_strategy_label: ReAct
          plugin_unique_identifier: langgenius/agent
          output_schema: null
      - id: end
        type: custom
        position:
          x: 810
          y: 300
        positionAbsolute:
          x: 810
          y: 300
        width: 243
        height: 100
        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: 返回分析结果
          desc: 返回给值班平台的结构化 JSON。
          selected: false
          outputs:
            - variable: analysis_json
              value_selector:
                - agent
                - text
              type: string
    edges:
      - id: start-source-agent-target
        type: custom
        source: start
        sourceHandle: source
        target: agent
        targetHandle: target
        zIndex: 0
        data:
          sourceType: start
          targetType: agent
          isInIteration: false
          isInLoop: false
      - id: agent-source-end-target
        type: custom
        source: agent
        sourceHandle: source
        target: end
        targetHandle: target
        zIndex: 0
        data:
          sourceType: agent
          targetType: end
          isInIteration: false
          isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 1
