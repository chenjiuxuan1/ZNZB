openapi: 3.0.3
info:
  title: Metabase 异常数据侧取证工具集
  version: 2.4.0
  description: >-
    只读取证工具集。Dify Agent 通过这 6 个工具自主追溯 Metabase 异常根因。
    不修改代码、不触发 DS 重跑。query_table_data 仅允许只读 SELECT。
servers:
- url: http://172.20.0.235:28787
paths:
  /api/tools/current-anomaly-evidence:
    post:
      operationId: get_current_anomaly_evidence
      summary: 读取本轮异常的原始证据快照
      description: >-
        仅读取同一巡检 runId 的短时原始证据快照；complete=false 时不得据此判定正常，
        必须继续调用既有实时工具。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, countryCode, snapshotId]
              properties:
                runId: { type: string }
                countryCode: { type: string, enum: [cn, ine, ph, th, pk, mx] }
                anomalyIndex: { type: integer, minimum: 0, description: 单条兼容模式可选；批量同底表快照不需要此字段 }
                snapshotId: { type: string }
      responses:
        '200':
          description: 本轮原始快照或不完整标记
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete: { type: boolean }
                  collectedAt: { type: string }
                  evidence: { type: object }
                  missing: { type: array, items: { type: string } }
  /api/tools/metabase-card-sql:
    post:
      operationId: get_card_sql
      summary: 读取异常对应 Metabase 卡片 SQL
      description: >-
        读取平台历史巡检中指定异常所关联卡片的 SQL。必须先调用此工具，
        从 SQL 中提取根表后才能调用 trace_lineage。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, countryCode, anomalyIndex]
              properties:
                runId: { type: string, description: 值班平台历史巡检 ID }
                countryCode: { type: string, enum: [cn, ine, ph, th, pk, mx] }
                anomalyIndex: { type: integer, minimum: 0, description: 异常序号 }
      responses:
        '200':
          description: 卡片定义与只读 SQL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  card:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      native_query: { type: object, nullable: true }
                      dataset_query: { type: object, nullable: true }
  /api/tools/warehouse-lineage:
    post:
      operationId: trace_lineage
      summary: 查询表的代码血缘
      description: >-
        查询指定国家和表名的代码血缘。只有 evidence.quality=producer_sql 时，
        upstreamTables 才可作为下一层递归追溯的有效证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation, countryCode, table]
              properties:
                operation: { type: string, enum: [trace_table] }
                countryCode: { type: string, enum: [cn, ine, ph, th, pk, mx] }
                table: { type: string, description: schema.table 格式的表名 }
                maxFiles: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: 血缘查询结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  table: { type: string }
                  upstreamTables: { type: array, items: { type: string } }
                  downstreamTables: { type: array, items: { type: string } }
                  evidence:
                    type: object
                    properties:
                      quality: { type: string, enum: [producer_sql, consumer_sql, declared_dependency_only, text_reference_only] }
  /api/tools/wattrel-query:
    post:
      operationId: check_wattrel
      summary: 查询 Wattrel 质量告警
      description: >-
        查询指定国家最近 3 天内的 Wattrel 质量告警（result=1）。
        如果异常表匹配到质量告警，异常可归因到数据质量问题。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [country]
              properties:
                country: { type: string, enum: [cn, ine, ph, th, pk, mx], description: 国家代码 }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50, description: 最多返回的告警数 }
      responses:
        '200':
          description: Wattrel 质量告警列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        quality_id: { type: integer }
                        name: { type: string }
                        type: { type: string }
                        src_tbl: { type: string }
                        dest_tbl: { type: string }
                        result: { type: integer }
                        status: { type: string }
                        created_at: { type: string }
  /api/tools/ds-scheduler:
    post:
      operationId: check_ds_status
      summary: 查询 DolphinScheduler 任务运行状态
      description: >-
        查询 DS 任务的运行状态。常用 action：
        - check_failed_instances：查失败实例，search_val 传工作流名或表名
        - search_resource_sql：按 SQL 搜 DS 资源，search_val 传 producer SQL
        - list_workflows：列工作流
        DS API token 由平台自动注入，无需传入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [country, action]
              properties:
                country: { type: string, enum: [cn, ine, ph, th, pk, mx], description: 国家代码 }
                action:
                  type: string
                  enum: [check_failed_instances, search_resource_sql, list_workflows, get_workflow, list_instances, get_instance, list_task_instances, get_task_log, list_projects, resolve_project, list_schedules, get_schedule, search_country_git_sql, dump_workflow_graph]
                  description: 只读查询动作
                search_val: { type: string, description: 搜索关键词（工作流名或 SQL） }
                start_time: { type: string, description: 开始时间 YYYY-MM-DD HH:mm:ss }
                end_time: { type: string, description: 结束时间 YYYY-MM-DD HH:mm:ss }
      responses:
        '200':
          description: DS 查询结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  country: { type: string }
                  action: { type: string }
                  data: { type: array, items: { type: object } }
                  error: { type: object, nullable: true }
  /api/tools/query-table-data:
    post:
      operationId: query_table_data
      summary: 直接查询 StarRocks 表数据（只读）
      description: >-
        通过 Fuxi SR 网关执行只读 SELECT 查询，直接验证底表数据是否存在、
        指标字段值是否为 0 或 NULL。用于区分「数据未产出」vs「数据产出但值为 0」。
        仅允许 SELECT/WITH/SHOW/DESC/EXPLAIN，禁止任何写操作。
        country 传 cn/ine/ph/th/pk/mx，平台自动映射到 SR 网关国家路由。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [country, sql]
              properties:
                country: { type: string, enum: [cn, ine, ph, th, pk, mx], description: 国家代码 }
                sql: { type: string, description: 只读 SELECT SQL，例如 SELECT grant_cnt_1d,pass_cnt_1d FROM ads.ads_3003_user_smmary_d WHERE stat_date='2026-07-31' AND user_category='总计' }
                limit: { type: integer, minimum: 1, maximum: 500, default: 100, description: 最多返回行数 }
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  columns: { type: array, items: { type: string } }
                  rows: { type: array, items: { type: object } }
                  rowCount: { type: integer }
                  truncated: { type: boolean }
