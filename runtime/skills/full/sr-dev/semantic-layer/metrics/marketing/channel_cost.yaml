id: marketing.channel_cost
kind: metric
name: 渠道花费
aliases:
  - channel cost
  - 渠道成本
  - 投放花费
description: 指定渠道和时间窗口内的归一化投放花费总额。
business_domain: marketing
owner:
  name: owenzhang
  team: data-warehouse
status: draft
freshness:
  expected_schedule: daily
  max_age_hours: 48
  verified_at: null
source:
  tier: semantic
  uri: semantic-layer/metrics/marketing/channel_cost.yaml
canonical_assets:
  - unresolved:marketing.channel_cost
filters:
  - name: exclude_test_account
    expression: is_test_account = 0
validation:
  status: draft
  notes:
    - 物理 canonical table、结算来源和币种换算尚未由 governed evidence 确认。
    - 墨西哥 smartconnect 案例仅用于定义检索入口，不代表现有口径已验证。
query_spec:
  default_country: mx
  datasource_hint: unresolved
  canonical_table: unknown
  metric_expression: SUM(channel_cost_amount)
  default_time_field: cost_date
  default_granularity: daily
  default_filters:
    - is_test_account = 0
  freshness:
    partition_field: dt
    expected_lag: T+1
    verification_required: true
  unit: currency
  required_parameters:
    - country
    - channel
    - time_range
    - currency
    - settlement_source
    - amount_unit
dimensions:
  - country
  - time
segments:
  - exclude_test_account
limitations:
  - 当前种子不定义汇率来源、税费处理或平台账单与内部结算的优先级。
  - 需要区分 BI 展示口径、ADS 口径和上游结算口径。
known_pitfalls:
  - 不同来源可能使用本币、美元或最小货币单位，汇总前必须统一单位。
  - 当天平台账单可能回补，不能在未检查 freshness 时输出强结论。
