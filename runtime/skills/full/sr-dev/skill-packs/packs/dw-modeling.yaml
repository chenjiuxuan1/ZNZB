id: dw-modeling
display_name: 数仓建模
description: 拆解数仓需求，判断主题域、分层、粒度、主键、刷新频率、复用资产、知识缺口和输出路由。
category: modeling
standalone_entry: "$dw-modeling"
agent_entry: "$dw-dev -> dw-modeling"
main_agent_impact: artifact-contract-only
required_skills:
  - dw-modeling
  - dw-knowledge
optional_skills:
  - dw-code-knowledge
  - sr_box
external_required:
  - dw-standards
provides:
  - modeling-decision
  - domain-model-plan
  - requirement-decomposition
  - knowledge-gap-blockers
  - duplicate-asset-decision
  - output-route-plan
  - sql-builder-handoff
boundaries:
  - 不执行 SQL。
  - 不写最终 SQL package，SQL 落地交给 dw-sql-builder。
  - 缺少口径、源表、粒度、SLA 或重复资产证据时必须输出阻断项。
