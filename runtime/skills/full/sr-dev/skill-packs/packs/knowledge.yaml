id: knowledge
display_name: 数仓知识库
description: 文档知识、语义上下文、query spec、补问材料和可选代码事实检索。
category: knowledge
standalone_entry: "$dw-knowledge"
agent_entry: "$dw-dev -> dw-knowledge"
main_agent_impact: artifact-contract-only
required_skills:
  - dw-knowledge
optional_skills:
  - dw-code-knowledge
  - dw-knowledge-init
external_required: []
provides:
  - semantic-context
  - reference-doc-routing
  - clarification-draft
  - document-knowledge
  - optional-code-evidence
boundaries:
  - 不执行 SQL。
  - 默认不查看代码；代码查看必须明确进入 dw-code-knowledge。
  - 不编造口径，知识缺失时必须补问或降级。
