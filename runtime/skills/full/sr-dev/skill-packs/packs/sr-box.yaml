id: sr-box
display_name: SR 查询与验证
description: production SR Box 查询、SSO、只读检查和 testdb 写保护验证入口。
category: execution
standalone_entry: "$sr-box"
agent_entry: "$dw-dev -> sr-box"
main_agent_impact: artifact-contract-only
required_skills:
  - sr_box
optional_skills:
  - sr-box-new
external_required: []
provides:
  - sr-query
  - production-sso-session
  - testdb-validation
  - traceable-evidence
boundaries:
  - 真实执行必须保留 route country 或 datasource。
  - 写入验证目标必须是 testdb。
  - 不生成 SQL，不替代 dw-sql-builder。
  - 不自动上线、不回写 Jira。
